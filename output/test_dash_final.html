<!DOCTYPE html>
<html lang="en">
<head>
    <title>Auto Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        :root {
            --vx-bg-page:       #F3F4F6;
            --vx-bg-card:       #FFFFFF;
            --vx-accent:        #0078D4;
            --vx-text-primary:  #1A1A2E;
            --vx-text-secondary:#6B7280;
            --vx-card-radius:   14px;
            --vx-shadow:        0 2px 12px rgba(0,120,212,0.08);
            --vx-transition:    all 0.35s cubic-bezier(.16,1,.3,1);
            --vx-ease:          cubic-bezier(0.32,0.72,0,1);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--vx-bg-page);
            color: var(--vx-text-primary);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100dvh; width: 100vw;
        }
        .vx-card {
            background: var(--vx-bg-card);
            border-radius: var(--vx-card-radius);
            box-shadow: var(--vx-shadow);
            transition: var(--vx-transition);
            overflow: auto;
            border: 1px solid rgba(128,128,128,0.08);
            position: relative;
        }
        .vx-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--vx-accent), transparent);
            opacity: 0;
            transition: var(--vx-transition);
        }
        .vx-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(0,0,0,0.18);
        }
        .vx-card:hover::before { opacity: 1; }
        .plotly-graph-div, .js-plotly-plot, .plot-container {
            width: 100% !important; height: 100% !important;
        }
        .vx-card::-webkit-scrollbar { width:5px; height:5px; }
        .vx-card::-webkit-scrollbar-track { background: transparent; }
        .vx-card::-webkit-scrollbar-thumb { background:#0078D455; border-radius:3px; }

        /* ── Modal overlay ── */
        .vx-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); z-index: 9000;
            align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .vx-modal-overlay.open { display: flex; }
        .vx-modal-box {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.4);
            border: 1px solid #0078D433;
            width: min(92vw, 1100px);
            max-height: 88vh;
            display: flex; flex-direction: column;
            overflow: hidden;
            animation: vxModalIn .22s cubic-bezier(.16,1,.3,1);
        }
        @keyframes vxModalIn {
            from { opacity:0; transform: scale(.96) translateY(12px); }
            to   { opacity:1; transform: scale(1) translateY(0); }
        }
        .vx-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px 14px;
            border-bottom: 1px solid #0078D422;
            flex-shrink: 0;
        }
        .vx-modal-header h3 {
            font-size: 1.05rem; font-weight: 700; color: var(--vx-text-primary);
        }
        .vx-modal-close {
            background: none; border: none; cursor: pointer;
            color: var(--vx-text-secondary); border-radius: 8px;
            width:32px; height:32px; display:flex; align-items:center; justify-content:center;
            transition: var(--vx-transition);
        }
        .vx-modal-close:hover { background:#0078D422; color:#0078D4; }
        .vx-modal-body {
            flex: 1; overflow: auto; padding: 20px 24px 24px;
        }

        /* ── Info FAB button on charts ── */
        .vx-chart-info-btn {
            position: absolute; bottom: 10px; right: 10px;
            width: 32px; height: 32px; border-radius: 50%;
            background: #0078D4EE; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            transition: var(--vx-transition); z-index: 10;
            opacity: 0.75;
        }
        .vx-chart-info-btn:hover { opacity:1; transform: scale(1.12); }
        .vx-chart-info-btn svg { pointer-events: none; }

        /* ── Data button ── */
        .vx-data-fab {
            position: fixed; bottom: 22px; right: 22px;
            background: #0078D4; color: #fff;
            border: none; border-radius: 50px;
            padding: 10px 20px; font-weight: 700; font-size: 0.82rem;
            cursor: pointer; z-index: 8000;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 18px #0078D455;
            transition: var(--vx-transition); letter-spacing: 0.3px;
        }
        .vx-data-fab:hover { transform: translateY(-2px); box-shadow: 0 8px 28px #0078D466; }
        
        .dashboard-container {
            padding: 74px 20px 20px;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .vx-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 14px;
            flex: 1; min-height: 0;
        }
        .c1_59e4ce { grid-area: 1 / 1 / 3 / 7; }
.c2_b471ec { grid-area: 1 / 7 / 3 / 13; }
.c3_9985f7 { grid-area: 3 / 1 / 8 / 7; }
.c4_65ada6 { grid-area: 3 / 7 / 8 / 13; }
        .vx-card { animation: vxCardIn .4s cubic-bezier(0.32,0.72,0,1) both; }
        @keyframes vxCardIn {
            from { opacity:0; transform:translateY(18px) scale(0.98); filter:blur(2px); }
            to   { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
        }
        .vx-valuebox { animation: vxValueIn .5s cubic-bezier(0.32,0.72,0,1) both; }
        @keyframes vxValueIn {
            from { opacity:0; transform:translateY(12px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .vx-card:nth-child(1){animation-delay:0.0s}
.vx-card:nth-child(2){animation-delay:0.05s}
.vx-card:nth-child(3){animation-delay:0.1s}
.vx-card:nth-child(4){animation-delay:0.15000000000000002s}
        @media(max-width:768px){
            .vx-grid { display:flex; flex-direction:column; overflow-y:auto; }
            .vx-card { min-height:220px; flex-shrink:0; }
            body { overflow-y:auto; }
        }
    </style>
</head>

                    var w = cont.clientWidth, h = cont.clientHeight;
                    if(w>0&&h>0) Plotly.relayout(d,{width:w,height:h});
                }
            }
            if(window.ResizeObserver && cont)
                new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(resize,50);}).observe(cont);
            window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(resize,100);});
            (function wait(n){
                var d=cont?cont.querySelector('.plotly-graph-div'):null;
                if(d&&window.Plotly) resize();
                else if(n>0) setTimeout(()=>wait(n-1),120);
            })(18);
        })();
        </script>
        </div>
    </div>
    
</body>
</html>
