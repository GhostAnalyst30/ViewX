<!DOCTYPE html>
<html lang="en">
<head>
    <title>Demo 3 · KPI Focus</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        :root {
            --vx-bg-page:       #07080F;
            --vx-bg-card:       #0F1117;
            --vx-accent:        #6366F1;
            --vx-text-primary:  #E2E5FF;
            --vx-text-secondary:#9CA3AF;
            --vx-card-radius:   14px;
            --vx-shadow:        0 8px 32px rgba(99,102,241,0.15);
            --vx-transition:    all 0.35s cubic-bezier(.16,1,.3,1);
            --vx-ease:          cubic-bezier(0.32,0.72,0,1);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--vx-bg-page);
            color: var(--vx-text-primary);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100dvh; width: 100vw;
        }
        .vx-card {
            background: var(--vx-bg-card);
            border-radius: var(--vx-card-radius);
            box-shadow: var(--vx-shadow);
            transition: var(--vx-transition);
            overflow: auto;
            border: 1px solid rgba(128,128,128,0.08);
            position: relative;
        }
        .vx-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--vx-accent), transparent);
            opacity: 0;
            transition: var(--vx-transition);
        }
        .vx-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.14);
        }
        .vx-card:hover::before { opacity: 1; }
        .vx-card.vx-card-static:hover {
            transform: none;
            box-shadow: var(--vx-shadow);
        }
        .vx-card-header {
            margin: 0; color: var(--vx-text-primary); font-weight: 600;
            font-size: 0.88rem;
            border-bottom: 2px solid rgba(128,128,128,0.12); padding-bottom: 6px;
        }
        .vx-kpi-body {
            padding: 18px 20px; display: flex; align-items: center;
            gap: 14px; height: 100%; position: relative; overflow: hidden;
        }
        .vx-sortable-table th { cursor: pointer; user-select: none; }
        .vx-sortable-table th:hover { background: #6366F118; }
        .plotly-graph-div, .js-plotly-plot, .plot-container {
            width: 100% !important; height: 100% !important;
        }
        .vx-card::-webkit-scrollbar { width:5px; height:5px; }
        .vx-card::-webkit-scrollbar-track { background: transparent; }
        .vx-card::-webkit-scrollbar-thumb { background:#6366F155; border-radius:3px; }

        /* ── Modal overlay ── */
        .vx-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); z-index: 9000;
            align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .vx-modal-overlay.open { display: flex; }
        .vx-modal-box {
            background: #0F1117;
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.4);
            border: 1px solid #6366F133;
            width: min(92vw, 1100px);
            max-height: 88vh;
            display: flex; flex-direction: column;
            overflow: hidden;
            animation: vxModalIn .22s cubic-bezier(.16,1,.3,1);
        }
        @keyframes vxModalIn {
            from { opacity:0; transform: scale(.96) translateY(12px); }
            to   { opacity:1; transform: scale(1) translateY(0); }
        }
        .vx-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px 14px;
            border-bottom: 1px solid #6366F122;
            flex-shrink: 0;
        }
        .vx-modal-header h3 {
            font-size: 1.05rem; font-weight: 700; color: var(--vx-text-primary);
        }
        .vx-modal-close {
            background: none; border: none; cursor: pointer;
            color: var(--vx-text-secondary); border-radius: 8px;
            width:32px; height:32px; display:flex; align-items:center; justify-content:center;
            transition: var(--vx-transition);
        }
        .vx-modal-close:hover { background:#6366F122; color:#6366F1; }
        .vx-modal-body {
            flex: 1; overflow: auto; padding: 20px 24px 24px;
        }

        /* ── Info FAB button on charts ── */
        .vx-chart-info-btn {
            position: absolute; bottom: 10px; right: 10px;
            width: 32px; height: 32px; border-radius: 50%;
            background: #6366F1EE; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            transition: var(--vx-transition); z-index: 10;
            opacity: 0.75;
        }
        .vx-chart-info-btn:hover { opacity:1; transform: scale(1.12); }
        .vx-chart-info-btn svg { pointer-events: none; }

        /* ── Data button ── */
        .vx-data-fab {
            position: fixed; bottom: 22px; right: 22px;
            background: #6366F1; color: #fff;
            border: none; border-radius: 50px;
            padding: 10px 20px; font-weight: 700; font-size: 0.82rem;
            cursor: pointer; z-index: 8000;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 18px #6366F155;
            transition: var(--vx-transition); letter-spacing: 0.3px;
        }
        .vx-data-fab:hover { transform: translateY(-2px); box-shadow: 0 8px 28px #6366F166; }
        
        .dashboard-container {
            padding: 74px 20px 20px;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .vx-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 14px;
            flex: 1; min-height: 0;
        }
        .c1_196302 { grid-area: 1 / 1 / 4 / 5; }
.c2_3fa6ff { grid-area: 1 / 5 / 4 / 9; }
.c3_34a872 { grid-area: 1 / 9 / 4 / 13; }
.c4_87a14f { grid-area: 4 / 1 / 8 / 7; }
.c5_ef1a95 { grid-area: 4 / 7 / 8 / 13; }
        .vx-card { animation: vxCardIn .4s cubic-bezier(0.32,0.72,0,1) both; }
        @keyframes vxCardIn {
            from { opacity:0; transform:translateY(18px) scale(0.98); filter:blur(2px); }
            to   { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
        }
        .vx-valuebox { animation: vxValueIn .5s cubic-bezier(0.32,0.72,0,1) both; }
        @keyframes vxValueIn {
            from { opacity:0; transform:translateY(12px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .vx-card:nth-child(1){animation-delay:0.0s}
.vx-card:nth-child(2){animation-delay:0.05s}
.vx-card:nth-child(3){animation-delay:0.1s}
.vx-card:nth-child(4){animation-delay:0.15000000000000002s}
.vx-card:nth-child(5){animation-delay:0.2s}
        @media(max-width:768px){
            .vx-grid { display:flex; flex-direction:column; overflow-y:auto; }
            .vx-card { min-height:220px; flex-shrink:0; }
            body { overflow-y:auto; }
        }
    </style>
</head>

    <script>
    (function(){
        document.querySelectorAll('.vx-sortable-table').forEach(function(table){
            table.querySelectorAll('th').forEach(function(th, colIdx){
                th.style.cursor = 'pointer';
                th.title = 'Click to sort';
                th.addEventListener('click', function(){
                    var tbody = table.querySelector('tbody');
                    if(!tbody) return;
                    var rows = Array.from(tbody.querySelectorAll('tr'));
                    var asc = th.dataset.sortDir !== 'asc';
                    table.querySelectorAll('th').forEach(function(h){ delete h.dataset.sortDir; });
                    th.dataset.sortDir = asc ? 'asc' : 'desc';
                    rows.sort(function(a, b){
                        var av = (a.children[colIdx] || {}).textContent || '';
                        var bv = (b.children[colIdx] || {}).textContent || '';
                        var an = parseFloat(av.replace(/[^0-9.-]/g, ''));
                        var bn = parseFloat(bv.replace(/[^0-9.-]/g, ''));
                        var cmp = (!isNaN(an) && !isNaN(bn)) ? (an - bn) : av.localeCompare(bv);
                        return asc ? cmp : -cmp;
                    });
                    rows.forEach(function(r){ tbody.appendChild(r); });
                });
            });
        });
    })();
    </script>
